<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>5m地形変化量表示マップ v3</title>
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.min.js"></script>
  <script src="src/plugins/leaflet-tilelayer-glue.js"></script>
  <script src="src/elvchange_shaders.js"></script>
  <style>
    #map {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
    }
    .back-link {
      position: absolute;
      top: 58px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      color: #0b5ed7;
      padding: 6px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .legend {
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      font-size: 12px;
      line-height: 18px;
    }
    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <a href="index.html" class="back-link">indexへ戻る</a>
  <div id="map"></div>

  <!-- 崩壊地GeoJSONデータの読み込み -->
  <script src="src/draw_houkai.js"></script>
  <script src="src/draw_houkai_wjw.js"></script>
  <!-- 盛土ポリゴンデータの読み込み -->
  <script src="src/draw_fill.js"></script>

  <script>
    var map = L.map("map", {
      zoom: 11,
      maxZoom: 17,
      center: [37.3972, 136.9023]
    });

    // ベースマップレイヤー
    var lyrBfCsMap = L.tileLayer(
      "https://www2.ffpri.go.jp/soilmap/tile/cs_noto/{z}/{x}/{y}.png",
      {
        minZoom: 8,
        maxZoom: 17,
        attribution: "森林総合研究所"
      }
    );

    var lyrCSMap = L.tileLayer(
      "https://forestgeo.info/opendata/17_ishikawa/noto/csmap_2024/{z}/{x}/{y}.webp",
      {
        minZoom: 8,
        maxZoom: 17,
        attribution: "林野庁"
      }
    );

    var lyrElvChange = L.tileLayer.glue(
      "https://forestgeo.info/opendata/17_ishikawa/noto/henka_2024/{z}/{x}/{y}.png",
      {
        attribution: "Forestry Agency",
        maxZoom: 17,
        maxNativeZoom: 14,
        opacity: 0.5,
        fragmentShader: colorMapShader
      }
    ).addTo(map);

    // オーバーレイレイヤー
    var lyrGSI = L.tileLayer(
      "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
      {
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
      }
    );

    var lyrGSI2024ort = L.tileLayer(
      "https://cyberjapandata.gsi.go.jp/xyz/20240102noto_0405_0426do/{z}/{x}/{y}.png",
      {
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
      }
    );

    var lyrGSI202409orte = L.tileLayer(
      "https://cyberjapandata.gsi.go.jp/xyz/20240923rain_wajimatobu_0924do_sokuho/{z}/{x}/{y}.png",
      {
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
      }
    );

    var lyrGSI202409ortw = L.tileLayer(
      "https://cyberjapandata.gsi.go.jp/xyz/20240923rain_wajimaseibu_0924do_sokuho/{z}/{x}/{y}.png",
      {
        attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>"
      }
    );

    // 旧地すべり地形分布図
    var landslideLayer = L.tileLayer(
      "https://jmapweb3v.bosai.go.jp/map/xyz/landslide/{z}/{x}/{y}.png",
      {
        format: "image/png",
        transparent: true,
        opacity: 0.7,
        minZoom: 5,
        maxZoom: 15,
        attribution: "<a href='http://www.j-shis.bosai.go.jp/JSHIS2/IMAGE/etc/landslide_v3_jp.png' target='_blank'>防災科研</a>"
      }
    );

    // 林野庁判読崩壊地・亀裂（PBFベクトルタイル）
    var lyrVectorLs = L.vectorGrid.protobuf(
      "https://forestgeo.info/opendata/17_ishikawa/noto/handoku_2024/{z}/{x}/{y}.pbf",
      {
        vectorTileLayerStyles: {
          'handoku_2024': {
            weight: 2,
            color: '#0000ff',
            fill: false
          },
          'handoku_2024_polygon': {
            weight: 2,
            color: '#0000ff',
            fill: true,
            fillColor: '#0000ff',
            fillOpacity: 0.2
          },
          'handoku_2024_point': {
            radius: 6,
            color: '#0000ff',
            fill: true,
            fillColor: '#0000ff',
            fillOpacity: 0.7
          }
        },
        interactive: true,
        maxNativeZoom: 17,
        minZoom: 8,
        maxZoom: 20,
        attribution: '林野庁（ベクトルタイル）',
        getFeatureId: function(f) { return f.id; }
      }
    );

    // 気象庁 高解像度降水ナウキャスト（雨雲レーダー）
    // タイルURLに時刻情報が必要なため、最新時刻をJSONから取得してURLを設定する
    var lyrJmaRadar = L.tileLayer('', {
      opacity: 0.6,
      zIndex: 500,
      minZoom: 4,
      maxZoom: 18,
      maxNativeZoom: 10,
      attribution: "<a href='https://www.jma.go.jp/bosai/nowc/' target='_blank'>気象庁 高解像度降水ナウキャスト</a>"
    });

    // 雨雲レーダーの時刻管理（実況＋予報を1本の時系列リストにまとめる）
    var jmaTimeList = [];         // { basetime, validtime, type: 'obs' | 'fcst' } の配列（古い→新しい→予報の順）
    var jmaLatestObsIndex = 0;    // 実況データのうち最新のもののインデックス
    var jmaTimeIndex = 0;         // 現在表示中のインデックス
    var jmaUserOverride = false;  // ユーザーがスライダーを手動操作したらtrue
    var jmaTimeSlider = null;
    var jmaTimeLabel = null;

    function parseJmaTime(t) {
      // "20260713191500" -> Dateオブジェクト（JST）
      return new Date(
        t.substring(0, 4) + '-' + t.substring(4, 6) + '-' + t.substring(6, 8) +
        'T' + t.substring(8, 10) + ':' + t.substring(10, 12) + ':' + t.substring(12, 14) + '+09:00'
      );
    }

    function formatJmaTime(t) {
      return t.substring(8, 10) + ':' + t.substring(10, 12);
    }

    function setJmaRadarByIndex(idx) {
      if (!jmaTimeList.length) return;
      idx = Math.max(0, Math.min(jmaTimeList.length - 1, idx));
      jmaTimeIndex = idx;

      var entry = jmaTimeList[idx];
      var url = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/' + entry.basetime +
        '/none/' + entry.validtime + '/surf/hrpns/{z}/{x}/{y}.png';
      lyrJmaRadar.setUrl(url);

      if (jmaTimeSlider) {
        jmaTimeSlider.max = jmaTimeList.length - 1;
        jmaTimeSlider.value = idx;
      }

      if (jmaTimeLabel) {
        var diffMin = Math.round(
          (parseJmaTime(entry.validtime) - parseJmaTime(jmaTimeList[jmaLatestObsIndex].validtime)) / 60000
        );
        var label = formatJmaTime(entry.validtime);
        if (entry.type === 'obs') {
          label += diffMin === 0 ? '（実況）' : '（' + diffMin + '分前・実況）';
        } else {
          label += '（+' + diffMin + '分予報）';
        }
        jmaTimeLabel.textContent = label;
      }
    }

    function updateJmaRadar() {
      Promise.all([
        fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json').then(function(r) { return r.json(); }),
        fetch('https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json').then(function(r) { return r.json(); })
      ])
        .then(function(results) {
          // N1: 実況（過去）データの時刻一覧、N2: 予報データの時刻一覧
          var obsTimes = results[0]
            .filter(function(t) { return t.basetime === t.validtime; })
            .slice()
            .reverse(); // 古い→新しい順に並べ替え
          var fcstTimes = results[1].slice().reverse(); // 近い→遠い予報の順に並べ替え

          if (!obsTimes.length) return;

          jmaLatestObsIndex = obsTimes.length - 1;

          jmaTimeList = obsTimes.map(function(t) {
            return { basetime: t.basetime, validtime: t.validtime, type: 'obs' };
          }).concat(fcstTimes.map(function(t) {
            return { basetime: t.basetime, validtime: t.validtime, type: 'fcst' };
          }));

          // ユーザーがスライダーを操作していなければ、常に最新の実況を表示する
          setJmaRadarByIndex(jmaUserOverride ? Math.min(jmaTimeIndex, jmaTimeList.length - 1) : jmaLatestObsIndex);
        })
        .catch(function(err) {
          console.error('雨雲レーダーデータの取得に失敗しました', err);
        });
    }

    updateJmaRadar();
    setInterval(updateJmaRadar, 5 * 60 * 1000); // 5分ごとに最新の時刻一覧へ更新

    // レイヤーコントロール
    var baseMaps = {
      "地震前CS立体図": lyrBfCsMap,
      "地震後CS立体図": lyrCSMap,
      "地理院地図": lyrGSI
    };

    var overlayMaps = {
      "5m色別": lyrElvChange,
      "地震後写真": lyrGSI2024ort,
      "豪雨後写真東": lyrGSI202409orte,
      "豪雨後写真西": lyrGSI202409ortw,
      "地震崩壊地東部": jsonHoukai,
      "地震崩壊地西部": jsonHoukai_wjw,
      "旧地すべり地形": landslideLayer,
      "林野庁判読崩壊地・亀裂": lyrVectorLs,
      "盛土": lyrFill,
      "雨雲レーダー（気象庁）": lyrJmaRadar
    };

    L.control.layers(baseMaps, overlayMaps).addTo(map);

    // 凡例の追加
    var legend = L.control({ position: 'bottomleft' });

    legend.onAdd = function(map) {
      var div = L.DomUtil.create('div', 'legend');

      legendLabels.forEach(function(label) {
        var item = document.createElement('div');
        item.innerHTML = '<i style="background:' + label[1] + '"></i> ' + label[0];
        div.appendChild(item);
      });

      return div;
    };

    legend.addTo(map);

    // 雨雲レーダーの凡例（気象庁の降水強度カラースケール）
    var jmaRadarLegendLabels = [
      ['1〜5 mm/h', '#a0d2ff'],
      ['5〜10 mm/h', '#338fff'],
      ['10〜20 mm/h', '#faf500'],
      ['20〜30 mm/h', '#ff9900'],
      ['30〜50 mm/h', '#ff2800'],
      ['50〜80 mm/h', '#b40068'],
      ['80 mm/h以上', '#720051']
    ];

    var jmaRadarLegend = L.control({ position: 'bottomright' });

    jmaRadarLegend.onAdd = function(map) {
      var div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<div style="font-weight:bold;margin-bottom:4px;">雨雲レーダー（降水強度）</div>';

      jmaRadarLegendLabels.forEach(function(label) {
        var item = document.createElement('div');
        item.innerHTML = '<i style="background:' + label[1] + '"></i> ' + label[0];
        div.appendChild(item);
      });

      return div;
    };

    // 雨雲レーダーの時刻スライダー（実況〜予報を切り替える）
    var jmaTimeControl = L.control({ position: 'topright' });

    jmaTimeControl.onAdd = function(map) {
      var div = L.DomUtil.create('div', 'legend');
      div.style.width = '230px';

      var title = document.createElement('div');
      title.style.fontWeight = 'bold';
      title.style.marginBottom = '4px';
      title.textContent = '雨雲レーダー時刻';
      div.appendChild(title);

      jmaTimeLabel = document.createElement('div');
      jmaTimeLabel.style.marginBottom = '4px';
      div.appendChild(jmaTimeLabel);

      jmaTimeSlider = document.createElement('input');
      jmaTimeSlider.type = 'range';
      jmaTimeSlider.min = 0;
      jmaTimeSlider.max = jmaTimeList.length ? jmaTimeList.length - 1 : 0;
      jmaTimeSlider.value = jmaTimeIndex;
      jmaTimeSlider.step = 1;
      jmaTimeSlider.style.width = '100%';
      div.appendChild(jmaTimeSlider);

      jmaTimeSlider.addEventListener('input', function() {
        jmaUserOverride = true;
        setJmaRadarByIndex(parseInt(jmaTimeSlider.value, 10));
      });

      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);

      // コントロール生成時点で最新のデータがあれば即座に反映する
      if (jmaTimeList.length) {
        setJmaRadarByIndex(jmaTimeIndex);
      }

      return div;
    };

    // 雨雲レーダーの表示・非表示に連動して凡例・時刻スライダーを切り替える
    map.on('overlayadd', function(e) {
      if (e.layer === lyrJmaRadar) {
        jmaRadarLegend.addTo(map);
        jmaTimeControl.addTo(map);
      }
    });

    map.on('overlayremove', function(e) {
      if (e.layer === lyrJmaRadar) {
        map.removeControl(jmaRadarLegend);
        map.removeControl(jmaTimeControl);
        jmaTimeSlider = null;
        jmaTimeLabel = null;
      }
    });

    // マップクリック時に標高値を取得
    map.on('click', function(e) {
      var latlng = e.latlng;
      var zoom = map.getZoom();

      // Web Mercator投影を使用してタイル座標を計算
      var x = (latlng.lng + 180) / 360 * Math.pow(2, zoom);
      var y = (1 - Math.log(Math.tan(latlng.lat * Math.PI / 180) + 1 / Math.cos(latlng.lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom);

      var tileX = Math.floor(x);
      var tileY = Math.floor(y);
      var pixelX = Math.floor((x - tileX) * 256);
      var pixelY = Math.floor((y - tileY) * 256);

      // タイルのURL
      var tileUrl = "https://forestgeo.info/opendata/17_ishikawa/noto/henka_2024/" + zoom + "/" + tileX + "/" + tileY + ".png";

      // 画像を読み込んでピクセルデータを取得
      var img = new Image();
      img.crossOrigin = "anonymous";

      img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        var imageData = ctx.getImageData(pixelX, pixelY, 1, 1);
        var data = imageData.data;

        // RGB値を0-1の範囲に正規化
        var r = data[0] / 255.0;
        var g = data[1] / 255.0;
        var b = data[2] / 255.0;

        var altitude = calculateAltitudeJS(r, g, b);

        // ポップアップを表示
        if (altitude === -9999.0) {
          L.popup()
            .setLatLng(latlng)
            .setContent('変化量: NA（データなし）')
            .openOn(map);
        } else {
          L.popup()
            .setLatLng(latlng)
            .setContent('変化量: ' + altitude.toFixed(2) + ' m<br/>座標: ' + latlng.lat.toFixed(5) + ', ' + latlng.lng.toFixed(5))
            .openOn(map);
        }
      };

      img.onerror = function() {
        L.popup()
          .setLatLng(latlng)
          .setContent('タイルデータの読み込みに失敗しました')
          .openOn(map);
      };

      img.src = tileUrl;
    });
  </script>
</body>

</html>
